<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>长夜灯 · 文字解谜</title>
<style>
  :root{
    --ink:#0d0b09; --ink2:#171310; --paper:#e6d8b8; --paper-dim:#9a8c6f;
    --gold:#d3bc8e; --gold-line:rgba(211,188,142,.28); --red:#b6402e;
    --panel:rgba(30,24,18,.88); --chipbg:rgba(230,216,184,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background-color:var(--ink);
    background:radial-gradient(1200px 700px at 50% -10%, #1d1712 0%, var(--ink2) 45%, var(--ink) 100%) fixed;
    color:var(--paper); font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    min-height:100vh; line-height:1.75;
  }
  #app{max-width:760px; margin:0 auto; padding:14px 16px 48px; position:relative}

  /* ---------- 顶栏 ---------- */
  .top{display:flex; align-items:center; gap:10px; padding:6px 0 12px; flex-wrap:wrap}
  .brand{font-size:20px; letter-spacing:6px; color:var(--gold); text-shadow:0 0 12px rgba(211,188,142,.35)}
  .chip{font-size:13px; color:var(--paper-dim); border:1px solid var(--gold-line); border-radius:999px; padding:2px 10px}
  .chip.lan{color:var(--gold); border-color:rgba(211,188,142,.5)}
  .top .sp{flex:1}
  .tbtn{background:var(--chipbg); border:1px solid var(--gold-line); color:var(--paper);
    font-family:inherit; font-size:13px; padding:6px 12px; border-radius:8px; cursor:pointer; min-height:34px}
  .tbtn:hover{border-color:var(--gold); box-shadow:0 0 10px rgba(211,188,142,.25)}

  /* ---------- 场景卡 ---------- */
  .scene{background:var(--panel); border:1px solid var(--gold-line); border-radius:14px;
    padding:20px 20px 16px; box-shadow:0 8px 40px rgba(0,0,0,.5); position:relative; overflow:hidden}
  .scene::before{content:""; position:absolute; inset:8px; border:1px solid rgba(211,188,142,.12);
    border-radius:10px; pointer-events:none}
  .s-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .s-name{font-size:22px; letter-spacing:4px; color:var(--gold)}
  .s-ch{font-size:12px; color:var(--paper-dim); letter-spacing:2px}
  .ambient{font-size:16px; margin:10px 0 4px; min-height:56px; cursor:pointer; text-align:justify}
  .caret{display:inline-block; width:1ch; color:var(--gold); animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .log{margin:8px 0 0; font-size:13.5px; color:var(--paper-dim); border-left:2px solid rgba(182,64,46,.45);
    padding-left:10px; display:flex; flex-direction:column; gap:2px}
  .log .err{color:#d3705e}
  .log .good{color:var(--gold)}

  /* ---------- 分区 ---------- */
  .sec{margin-top:18px}
  .sec-t{font-size:12.5px; letter-spacing:4px; color:var(--paper-dim); margin-bottom:8px;
    display:flex; align-items:center; gap:10px}
  .sec-t::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--gold-line),transparent)}

  .chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px}
  .hs{background:var(--chipbg); border:1px dashed rgba(211,188,142,.35); color:var(--paper);
    font-family:inherit; font-size:14px; padding:9px 8px; border-radius:9px; cursor:pointer; min-height:42px}
  .hs:hover{border-style:solid; border-color:var(--gold); box-shadow:0 0 8px rgba(211,188,142,.2)}
  .hs.taken{opacity:.38}

  .exits{display:flex; flex-direction:column; gap:8px}
  .exit{display:flex; align-items:center; gap:10px; text-align:left; background:rgba(211,188,142,.07);
    border:1px solid rgba(211,188,142,.4); color:var(--paper); font-family:inherit; font-size:15px;
    padding:12px 14px; border-radius:10px; cursor:pointer; min-height:46px}
  .exit::before{content:"➤"; color:var(--gold); font-size:12px}
  .exit:hover{border-color:var(--gold); box-shadow:0 0 12px rgba(211,188,142,.25)}
  .exit.locked{opacity:.6; border-style:dashed}
  .exit.locked::before{content:"⊟"; color:var(--red)}
  .exit.lock:hover{border-color:var(--red); box-shadow:0 0 10px rgba(182,64,46,.3)}

  /* ---------- 谜题 ---------- */
  .puzzle{border:1px solid rgba(211,188,142,.35); border-radius:12px; padding:14px; margin-bottom:12px;
    background:rgba(0,0,0,.22)}
  .puzzle.intro-dialog{border-color:rgba(182,64,46,.6); box-shadow:0 0 24px rgba(182,64,46,.15)}
  .pz-prompt{font-size:15px; margin-bottom:12px}
  .pz-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  input[type=text]{background:rgba(0,0,0,.4); border:1px solid var(--gold-line); color:var(--paper);
    font-family:inherit; font-size:17px; letter-spacing:6px; padding:9px 12px; border-radius:8px; width:11em}
  input[type=text]:focus{outline:none; border-color:var(--gold)}
  .opt,.act{background:var(--chipbg); border:1px solid rgba(211,188,142,.4); color:var(--paper);
    font-family:inherit; font-size:14.5px; padding:10px 14px; border-radius:9px; cursor:pointer; min-height:42px}
  .opt:hover,.act:hover{border-color:var(--gold); box-shadow:0 0 8px rgba(211,188,142,.2)}
  .opt.wrong{opacity:.45; border-color:var(--red)}
  .hint-row{margin-top:10px; display:flex; align-items:center; gap:8px}
  .hint-btn{background:none; border:1px dashed rgba(211,188,142,.4); color:var(--paper-dim);
    font-family:inherit; font-size:12.5px; padding:4px 10px; border-radius:999px; cursor:pointer}
  .hint-btn:hover{color:var(--gold); border-color:var(--gold)}
  .hint-text{font-size:13.5px; color:var(--gold)}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* 九钉 */
  .grid9{display:grid; grid-template-columns:repeat(3,58px); gap:6px; justify-content:center}
  .pin{width:58px; height:58px; display:flex; align-items:center; justify-content:center;
    background:rgba(211,188,142,.08); border:1px solid var(--gold-line); border-radius:9px;
    color:var(--gold); font-size:26px; cursor:pointer; transition:transform .18s}
  .pin:hover{border-color:var(--gold)}
  .pin.core{cursor:default; color:#e8b04b; background:rgba(232,176,75,.1); text-shadow:0 0 10px rgba(232,176,75,.8)}
  .pin .ar{display:inline-block}
  /* 算盘 */
  .abacus{display:flex; gap:14px; justify-content:center; padding:10px 0}
  .rod{display:flex; flex-direction:column; align-items:center; gap:6px}
  .rod-t{font-size:12px; color:var(--paper-dim)}
  .bead{width:46px; height:20px; border-radius:10px; background:linear-gradient(180deg,#8a5a33,#5d3a1e);
    border:1px solid rgba(230,216,184,.35); cursor:pointer}
  .bead.on{background:linear-gradient(180deg,#d3a04c,#9a6a2a); box-shadow:0 0 8px rgba(211,160,76,.45)}
  .bead-mid{height:8px}
  /* 序项 */
  .seq{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .seq .opt{min-width:64px; font-size:17px}
  .seq-done{color:var(--gold); font-size:13px; margin-top:8px; text-align:center; letter-spacing:2px}

  /* ---------- 结局页 ---------- */
  .ending{max-width:640px; margin:40px auto; text-align:center}
  .ending .num{letter-spacing:6px; color:var(--paper-dim); font-size:14px}
  .ending h1{letter-spacing:10px; color:var(--gold); font-weight:500; margin:10px 0 18px; text-shadow:0 0 18px rgba(211,188,142,.4)}
  .ending .etxt{text-align:justify; font-size:16px; margin:0 0 18px}
  .ending .stat{font-size:13px; color:var(--paper-dim); margin-bottom:22px}

  /* ---------- 标题页 ---------- */
  .title-wrap{text-align:center; padding-top:9vh}
  .lamp{width:74px; height:96px; margin:0 auto 8px; position:relative}
  .lamp .body{position:absolute; inset:0; border-radius:46% 46% 50% 50%;
    background:radial-gradient(60% 55% at 50% 42%, rgba(255,190,90,.95), rgba(200,90,30,.75) 60%, rgba(120,40,10,.6));
    box-shadow:0 0 60px 18px rgba(255,160,60,.25), 0 0 140px 50px rgba(255,120,30,.12); animation:breathe 3.2s ease-in-out infinite}
  .lamp .cap,.lamp .base{position:absolute; left:50%; transform:translateX(-50%); width:34px; height:9px;
    background:linear-gradient(180deg,#3a2c1c,#241a10); border-radius:4px}
  .lamp .cap{top:-2px} .lamp .base{bottom:-2px}
  @keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
  h1.gtitle{font-size:44px; letter-spacing:18px; color:var(--gold); font-weight:500; margin:6px 0 4px; text-indent:18px}
  .gsub{color:var(--paper-dim); letter-spacing:4px; font-size:14px; margin-bottom:34px}
  .mbtn{display:block; width:min(320px,86vw); margin:12px auto; background:var(--chipbg);
    border:1px solid rgba(211,188,142,.45); color:var(--paper); font-family:inherit; font-size:16px;
    letter-spacing:6px; padding:13px 10px; border-radius:10px; cursor:pointer}
  .mbtn:hover{border-color:var(--gold); box-shadow:0 0 14px rgba(211,188,142,.3)}
  .mbtn.warn{color:#d3705e; border-color:rgba(182,64,46,.55)}

  /* ---------- 弹层 ---------- */
  .overlay{position:fixed; inset:0; background:rgba(5,4,3,.72); display:flex; align-items:center;
    justify-content:center; padding:18px; z-index:50}
  .panel{background:var(--panel); border:1px solid var(--gold-line); border-radius:14px; max-width:560px;
    width:100%; max-height:82vh; overflow:auto; padding:20px}
  .panel h2{margin:0 0 14px; font-size:17px; letter-spacing:6px; color:var(--gold); font-weight:500}
  .panel .close{float:right; background:none; border:none; color:var(--paper-dim); font-size:20px; cursor:pointer}
  .item-row{border-bottom:1px dashed rgba(211,188,142,.18); padding:9px 2px}
  .item-row b{color:var(--gold); font-weight:500}
  .item-row .d{font-size:13.5px; color:var(--paper-dim)}
  .note-ch{font-size:12px; color:var(--paper-dim); letter-spacing:3px; margin:14px 0 4px}
  .note-row{font-size:14px; padding:7px 2px; border-bottom:1px dashed rgba(211,188,142,.12)}
  .note-row.synth{color:var(--gold)}
  .set-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px;
    border-bottom:1px dashed rgba(211,188,142,.15)}
  .end-card{border:1px solid var(--gold-line); border-radius:10px; padding:12px 14px; margin-bottom:10px}
  .end-card.seen{border-color:rgba(211,188,142,.7); box-shadow:0 0 10px rgba(211,188,142,.15)}
  .end-card b{color:var(--gold); font-weight:500; letter-spacing:3px}
  .end-card .bl{font-size:13px; color:var(--paper-dim)}
  .end-card .tag{font-size:12px; color:var(--red)}
  .empty{color:var(--paper-dim); font-size:14px; text-align:center; padding:20px 0}

  .fade-in{animation:fadein .5s}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (max-width:480px){
    #app{padding:10px 10px 40px}
    .scene{padding:16px 14px 12px}
    .ambient{font-size:15px}
    .grid9{grid-template-columns:repeat(3,52px)} .pin{width:52px; height:52px; font-size:22px}
    h1.gtitle{font-size:34px; letter-spacing:12px}
  }
</style>
</head>

        { "id": "nameless_tablet", "label": "守灯人的牌位", "text": "牌位皆无字——你原以为是灯吃掉的。细看才明白：不是被抹去，是从来就没写过。守灯人的名字不在牌位上。那在哪儿？", "give": { "note": { "id": "n_shrine_nameless", "t": "守灯人的牌位不是被抹名，是从未写过——他们的名字不在牌位上。" } } },
        { "id": "lamp_big", "label": "磨盘大的琉璃灯", "text": "灯焰不摇，映得人脸上发白。你凑近时，焰心极轻地顿了一顿，像心跳漏了一拍。" },
        { "id": "stele_book", "label": "灯谱原册", "text": "灯谱的原册供在案上。翻开，三百六十一个名字，每个名字后面都跟着一行小字：还。——还了三百年，一个都没还成。", "give": { "note": { "id": "n_book", "t": "灯谱原册：三百六十一个名字，每个后面小字「还」。还了三百年，一个都没还成。" } } },

  ],
  "endings": {
    "e_dawn": {
      "num": "结局一", "name": "天亮启程",
      "blurb": "按规矩落名安歇。天亮之后，你想不起客栈的样子。",
      "text": "你把名字端端正正落进灯谱，睡去。\n\n天亮时你醒来，行囊齐整，房钱付讫。走出山口，你回头想再看一眼客栈——想不起来了。想不起它挂在山坳里的样子，想不起掌柜的脸，也想不起自己心口为什么空了一块。\n\n路牌上写着：灯下不问。\n\n你没有问。"
    },
    "e_dark": {
      "num": "结局二", "name": "灯灭",
      "blurb": "剪断灯芯之前，没有先给灯一个替代的名字。",
      "text": "剪口合拢的那一瞬，整座山安静下来。\n\n灯焰灭了。四壁的牌位同时转过来，对着你。没有风，可你听见了三百六十一个人的呼吸。\n\n灯要活着，就得有芯。乌老板用了一百年——你是最好的那一截。"
    },
    "e_true": {
      "num": "结局三", "name": "灯长明",
      "blurb": "以画换名。灯谱焚尽，白先生走出画外，阿九记起自己是阿昭。",
      "text": "你把记忆之画举进灯焰。火沿着画里的笔触爬上去，画中一扇扇门接连烧穿——白先生从灰烬里直起身来，拍拍衣襟上的火星，像只是打了个盹。\n\n你把乌木名牌按进阿九手心。他张了张嘴，三十年来第一声：「……阿昭。」\n\n灯谱无火自燃。三百六十一个名字腾起来，像一群终于肯散的萤。你举起祖传灯笼，接住最后一粒火种——灯认得回家的路。\n\n天亮时，一行人下山。斗笠落在案上，里头空空的。"
    },
    "e_keeper": {
      "num": "隐藏结局 · 甲", "name": "灯影中人",
      "blurb": "十二粒灯花齐备。你接过斗笠，做一盏自由的灯。",
      "text": "你没有走进画里，也没有剪断灯芯。\n\n你摘下那顶斗笠。灯焰轻轻晃了晃——一百年来，它第一次等到一个自愿的人。\n\n守灯人不必把脸喂给灯，只需要记得每一盏灯为什么亮。你把十二粒灯花嵌进灯壁，每嵌一粒，灯影里就多一段没被吃掉的记忆：山道上的雨、灶上的粥、井底的刻痕、戏台上的锣鼓。\n\n从这一夜起，山中多了一盏自由的灯：它照着夜路，不问来路，也不吃名字。"
    },
    "e_none": {
      "num": "结局四", "name": "无名",
      "blurb": "把生人的名字投进灯里——灯从没吃过一个还没落谱的名字。",
      "text": "你把拓下来的生名名条投进灯焰。\n\n灯愣住了。它吃了三百年的名字，从没吃过一个还没落进灯谱的名字——生名卡在灯芯里，像鱼骨卡在喉咙。整座山的灯同时暗了一暗，满堂低头的影子在同一瞬间直起腰来。\n\n你拽着离你最近的一只纸手臂往山下跑。身后锣鼓大作，像一场迟了三百年的散戏。\n\n天亮时分你摔出山口，手里还攥着半只纸手。你没敢回头，看你拽出来的是谁。\n\n碑上写着：灯下不问。这一夜，是灯答不上来。"
    },
    "e_perfect": {
      "num": "隐藏结局 · 乙", "name": "完璧",
      "blurb": "三段记忆各自归位。灯谱焚尽，白先生归来，阿昭开口，灯芯卸任。",
      "text": "你把记忆之画举进灯焰，把阿昭的名牌按进他手心，再把三页画稿在火光前铺开——白先生年轻时的笔触，阿昭孩童时的眉眼，乌老板没有喂灯之前的样子。\n\n灯焰认出了他们。\n\n灯谱无火自燃。三百六十一个名字腾空而起，像一场倒放的雪。白先生从画里走下来，拍拍衣襟上的火星；阿九张了张嘴，三十年来第一声——\n\n「爹。」\n\n斗笠底下，那束安静的火轻轻晃了晃，熄了。名字还给了名字，脸还给了脸，灯芯卸了三百年的任。\n\n天亮时，你们一行人下山。祖传灯笼留在空了的客栈门口，灯壁里嵌着灯花——从此它只照路，不问来路，也不吃名字。"

<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('game-data').textContent);
  var META = DATA.meta, ITEMS = DATA.items, PZ = {};
  Object.keys(DATA.puzzles).forEach(function (k) { PZ[k] = DATA.puzzles[k]; });
  Object.keys(DATA.usePuzzles || {}).forEach(function (k) {
    PZ[k] = Object.assign({ type: 'use' }, DATA.usePuzzles[k]);
  });
  var SCENES = {}; DATA.scenes.forEach(function (s) { SCENES[s.id] = s; });
  var SYNTH = DATA.synth || [], ENDINGS = DATA.endings;

  var SAVE_KEY = 'changye.save.v1', END_KEY = 'changye.endings.v1', CFG_KEY = 'changye.cfg.v1';
  var app = document.getElementById('app');
  var TYPE_TIMER = null, overlay = null;

  /* ---------------- 状态 ---------------- */
  var S = null, view = 'title';
  var cfg = { snd: true, tspeed: 1 };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) {}

  function newGame() {
    var arrows = [];
    for (var i = 0; i < 9; i++) arrows.push(Math.floor(Math.random() * 8));
    arrows[4] = -1; // 灯心
    var mismatches = arrows.filter(function (d, i) { return d >= 0 && d !== PZ.nine_box.targets[i]; }).length;
    if (mismatches < 2) arrows[0] = (arrows[0] + 3) % 8;
    S = {
      v: 1, scene: 'road', items: [], flags: {}, solved: {}, notes: {}, lanterns: [],
      arrows: arrows, abacus: [0, 0, 0], seqProg: {}, activeLock: null, visited: { road: true },
      log: [], hintsUsed: 0, t0: Date.now()
    };
    save();
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || d.v !== 1 || !SCENES[d.scene]) return false;
      S = d; return true;
    } catch (e) { return false; }
  }
  function endingsSeen() {
    try { return JSON.parse(localStorage.getItem(END_KEY) || '{}'); } catch (e) { return {}; }
  }
  function markEnding(id) {
    var e = endingsSeen(); e[id] = true;
    try { localStorage.setItem(END_KEY, JSON.stringify(e)); } catch (x) {}
  }

  /* ---------------- 条件判定 ---------------- */
  function partOk(r) {
    if (r.items && !r.items.every(function (i) { return S.items.indexOf(i) >= 0; })) return false;
    if (r.flags && !r.flags.every(function (f) { return !!S.flags[f]; })) return false;
    if (r.solved && !r.solved.every(function (p) { return !!S.solved[p]; })) return false;
    if (r.notes && !r.notes.every(function (n) { return !!S.notes[n]; })) return false;
    if (r.min_lanterns && S.lanterns.length < r.min_lanterns) return false;
    return true;
  }
  function reqOk(r) {
    if (!r) return true;
    if (r.any) return r.any.some(partOk);
    return partOk(r);
  }

  /* ---------------- 反馈 / 授予 ---------------- */
  function log(msg, cls) {
    S.log.push({ t: msg, c: cls || '' });
    if (S.log.length > 6) S.log = S.log.slice(-6);
  }
  function chapterOf() { return META.chapters[S.scene] || ''; }
  function addNote(id, t) {
    if (S.notes[id]) return;
    S.notes[id] = { t: t, ch: chapterOf() };
    checkSynth();
  }
  function checkSynth() {
    SYNTH.forEach(function (sn) {
      if (S.notes[sn.id]) return;
      if (sn.needs.every(function (n) { return !!S.notes[n]; })) {
        S.notes[sn.id] = { t: sn.t, ch: chapterOf(), synth: true };
        log('线索互相印证，你想起了一件事：' + sn.t, 'good');
      }
    });
  }
  function grant(g) {
    if (!g) return;
    if (g.item && S.items.indexOf(g.item) < 0) {
      S.items.push(g.item);
      log('获得：' + ITEMS[g.item].n, 'good');
    }
    if (g.items) g.items.forEach(function (i) {
      if (S.items.indexOf(i) < 0) { S.items.push(i); log('获得：' + ITEMS[i].n, 'good'); }
    });
    if (g.flag) S.flags[g.flag] = true;
    if (g.note) addNote(g.note.id, g.note.t);
    if (g.lantern && S.lanterns.indexOf(g.lantern.id) < 0) {
      S.lanterns.push(g.lantern.id);
      log('拾得 ' + g.lantern.n + '（' + S.lanterns.length + '/' + META.lanternTotal + '）', 'good');
    }
    checkSynth();
  }

  /* ---------------- 音效 ---------------- */
  var AC = null;
  function tone(freq, dur, type, gain, when) {
    if (!cfg.snd) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t = AC.currentTime + (when || 0);
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  var SND = {
    click: function () { tone(640, 0.06, 'triangle', 0.05); },
    page: function () { tone(420, 0.08, 'triangle', 0.045); tone(560, 0.07, 'triangle', 0.03, 0.05); },
    unlock: function () { tone(880, 0.1, 'sine', 0.07); tone(1320, 0.14, 'sine', 0.06, 0.09); },
    error: function () { tone(170, 0.16, 'square', 0.045); },
    solve: function () { [523, 659, 784].forEach(function (f, i) { tone(f, 0.16, 'sine', 0.06, i * 0.09); }); },
    flower: function () { [1175, 1568].forEach(function (f, i) { tone(f, 0.12, 'sine', 0.05, i * 0.07); }); },
    ending: function () { [392, 523, 659, 784].forEach(function (f, i) { tone(f, 0.5, 'sine', 0.05, i * 0.18); }); }
  };

  /* ---------------- 渲染工具 ---------------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function typeInto(node, text, done) {
    clearInterval(TYPE_TIMER);
    var cfgSpeeds = [0, 16, 34];
    var sp = cfgSpeeds[cfg.tspeed] != null ? cfgSpeeds[cfg.tspeed] : 16;
    if (!sp) { node.textContent = text; if (done) done(); return; }
    var i = 0;
    node.textContent = '';
    var caret = el('span', 'caret', '▌');
    node.appendChild(caret);
    TYPE_TIMER = setInterval(function () {
      i++;
      node.textContent = text.slice(0, i);
      node.appendChild(caret);
      if (i >= text.length) {
        clearInterval(TYPE_TIMER);
        setTimeout(function () { if (caret.parentNode) caret.parentNode.removeChild(caret); }, 1400);
        if (done) done();
      }
    }, sp);
    node.onclick = function () {
      clearInterval(TYPE_TIMER);
      node.textContent = text;
      if (done) done();
    };
  }

  /* ---------------- 谜题交互 ---------------- */
  function solvePuzzle(pid, successText, silentLog) {
    S.solved[pid] = true;
    grant(PZ[pid].onSolve);
    if (!silentLog) log(successText || PZ[pid].success || '你解开了它。', 'good');
    SND.solve();
    if (S.activeLock === pid) S.activeLock = null;
    save(); render();
  }
  function puzzleHints(pid) {
    var def = PZ[pid]; if (!def || !def.hints || !def.hints.length) return null;
    var box = el('div', 'hint-row');
    var btn = el('button', 'hint-btn', '💡 提示');
    var shown = el('span', 'hint-text');
    var lv = 0;
    btn.onclick = function () {
      if (lv >= def.hints.length) return;
      shown.textContent = def.hints[lv];
      lv++; S.hintsUsed++; save();
      if (lv >= def.hints.length) {
        btn.textContent = '💡 没有更多提示了';
        btn.disabled = true;
        var give = el('button', 'hint-btn', '直接告诉我答案');
        give.onclick = function () {
          S.hintsUsed++;
          var ans = '';
          if (def.accept) ans = '答案：' + def.accept[0];
          else if (def.target != null) ans = '答案：拨出 ' + def.target;
          else if (def.seq) ans = '次序：' + def.seq.join(' ');
          else if (def.groups) ans = '次序：' + def.groups.map(function (g) { return g.join(''); }).join(' → ');
          shown.textContent = ans || '再四处看看，线索就在明处。';
          give.disabled = true; save();
        };
        box.appendChild(give);
      }
      SND.page(); save();
    };
    box.appendChild(btn); box.appendChild(shown);
    return box;
  }

  function buildCodePuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle');
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var row = el('div', 'pz-row');
    var input = el('input'); input.type = 'text'; input.placeholder = '……';
    input.setAttribute('maxlength', '12'); input.dataset.role = 'code-input';
    var btn = el('button', 'act', '拨动锁环');
    btn.onclick = tryCode;
    input.onkeydown = function (e) { if (e.key === 'Enter') tryCode(); };
    function tryCode() {
      var v = (input.value || '').replace(/\s/g, '');
      var hit = def.accept.some(function (a) { return a === v; });
      if (hit) { SND.unlock(); solvePuzzle(pid, def.success); }
      else { log(def.wrongFb || '纹丝不动。', 'err'); SND.error(); box.classList.add('shake'); setTimeout(function () { box.classList.remove('shake'); }, 400); save(); renderLog(); }
    }
    row.appendChild(input); row.appendChild(btn);
    box.appendChild(row);
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildChoicePuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle' + (def.intro ? ' intro-dialog' : ''));
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var opts = el('div', 'pz-row');
    opts.style.flexDirection = 'column';
    opts.style.alignItems = 'stretch';
    def.options.forEach(function (op) {
      var b = el('button', 'opt', op.t);
      b.onclick = function () {
        SND.click();
        if (op.correct || def.intro) {
          if (op.fb) log(op.fb, op.correct ? 'good' : '');
          if (op.give) grant(op.give);
          if (op.flag) { S.flags[op.flag] = true; checkSynth(); }
          if (op.note) addNote(op.note.id, op.note.t);
          S.solved[pid] = true;
          if (S.activeLock === pid) S.activeLock = null;
          SND.unlock(); save(); render();
        } else {
          log(op.fb || '……', 'err');
          SND.error();
          b.classList.add('wrong'); b.disabled = true;
          save(); renderLog();
        }
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildUsePuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle');
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var can = reqOk(def.requires);
    var btn = el('button', 'act', def.btn || '动手');
    if (!can) btn.classList.add('opt-wrong');
    btn.onclick = function () {
      if (!reqOk(def.requires)) { log(def.fail || '还差些东西。', 'err'); SND.error(); save(); renderLog(); return; }
      SND.unlock(); solvePuzzle(pid, def.success);
    };
    box.appendChild(btn);
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildAbacusPuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle');
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var wrap = el('div', 'abacus');
    var labels = ['百', '十', '个'];
    var unit = el('div', 'abacus');
    for (var r = 0; r < 3; r++) {
      (function (r) {
        var rod = el('div', 'rod');
        rod.appendChild(el('div', 'rod-t', labels[r]));
        var upper = el('div', 'bead' + (S.abacus[r] >= 5 ? ' on' : ''));
        upper.title = '上珠（五）';
        upper.onclick = function () {
          S.abacus[r] = S.abacus[r] >= 5 ? S.abacus[r] - 5 : S.abacus[r] + 5;
          SND.click(); save(); render();
        };
        rod.appendChild(upper);
        rod.appendChild(el('div', 'bead-mid'));
        var lowerPart = S.abacus[r] % 5;
        for (var b = 0; b < 4; b++) {
          (function (b) {
            var bead = el('div', 'bead' + (lowerPart > b ? ' on' : ''));
            bead.onclick = function () {
              var cur = S.abacus[r] % 5;
              S.abacus[r] = S.abacus[r] - cur + (cur === b + 1 ? 0 : b + 1);
              SND.click(); save(); render();
            };
            rod.appendChild(bead);
          })(b);
        }
        wrap.appendChild(rod);
      })(r);
    }
    box.appendChild(wrap);
    var val = S.abacus[0] * 100 + S.abacus[1] * 10 + S.abacus[2];
    if (val === def.target) { SND.unlock(); solvePuzzle(pid, def.success); return box; }
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildRotatePuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle');
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var grid = el('div', 'grid9');
    var allOk = true;
    for (var i = 0; i < 9; i++) {
      (function (i) {
        if (def.targets[i] == null) {
          var core = el('div', 'pin core', '❖');
          grid.appendChild(core); return;
        }
        var cur = S.arrows[i], ok = cur === def.targets[i];
        if (!ok) allOk = false;
        var p = el('div', 'pin');
        var ar = el('span', 'ar', '➤');
        ar.style.display = 'inline-block';
        ar.style.transform = 'rotate(' + (cur * 45 - 90) + 'deg)';
        p.appendChild(ar);
        p.onclick = function () {
          S.arrows[i] = (S.arrows[i] + 1) % 8;
          SND.click(); save(); render();
        };
        grid.appendChild(p);
      })(i);
    }
    box.appendChild(grid);
    if (allOk) { SND.unlock(); solvePuzzle(pid, def.success); return box; }
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildOrderPuzzle(pid) {
    var def = PZ[pid], box = el('div', 'puzzle');
    box.dataset.pz = pid;
    box.appendChild(el('div', 'pz-prompt', def.prompt));
    var groups = def.groups || def.seq.map(function (x) { return [x]; });
    var prog = S.seqProg[pid] || { g: 0, picked: [] };
    var row = el('div', 'seq');
    def.items.forEach(function (it) {
      var b = el('button', 'opt', it);
      b.onclick = function () {
        var g = groups[prog.g];
        if (!g) return;
        if (prog.picked.indexOf(it) >= 0) return;
        if (g.indexOf(it) >= 0) {
          prog.picked.push(it);
          SND.click();
          if (prog.picked.length === g.length) {
            prog.g++; prog.picked = [];
            if (prog.g >= groups.length) {
              S.seqProg[pid] = { g: 0, picked: [] };
              SND.unlock(); solvePuzzle(pid, def.success); return;
            }
          }
          S.seqProg[pid] = prog; save(); render();
        } else {
          log(def.wrongFb || '不对。', 'err');
          SND.error();
          S.seqProg[pid] = { g: 0, picked: [] };
          box.classList.add('shake'); setTimeout(function () { box.classList.remove('shake'); }, 400);
          save(); render();
        }
      };
      row.appendChild(b);
    });
    box.appendChild(row);
    var progText = '';
    for (var gi = 0; gi < prog.g; gi++) progText += groups[gi].join('') + ' → ';
    if (progText) box.appendChild(el('div', 'seq-done', progText.slice(0, -3)));
    var h = puzzleHints(pid); if (h) box.appendChild(h);
    return box;
  }

  function buildPuzzle(pid) {
    var def = PZ[pid];
    if (!def) return null;
    if (def.type === 'code') return buildCodePuzzle(pid);
    if (def.type === 'choice') return buildChoicePuzzle(pid);
    if (def.type === 'use') return buildUsePuzzle(pid);
    if (def.type === 'abacus') return buildAbacusPuzzle(pid);
    if (def.type === 'rotate') return buildRotatePuzzle(pid);
    if (def.type === 'order') return buildOrderPuzzle(pid);
    return null;
  }

  /* ---------------- 场景交互 ---------------- */
  function clickHotspot(hs) {

  function clickExit(exit) {
    if (!reqOk(exit.requires)) {
      SND.error();
      log(exit.failText || '过不去。', 'err');
      if (exit.lockPuzzle && !S.solved[exit.lockPuzzle]) S.activeLock = exit.lockPuzzle;
      save(); render();
      return;
    }
    SND.page();
    S.scene = exit.to;
    S.activeLock = null;
    S.visited[exit.to] = true;
    S.log = [];
    if (exit.enterText) log(exit.enterText, 'good');
    save(); render();
  }

    SND.ending();

  function renderGame() {
    clear(app);
    var sc = SCENES[S.scene];

    /* 顶栏 */
    var top = el('div', 'top');
    top.appendChild(el('div', 'brand', META.title));
    top.appendChild(el('div', 'chip', chapterOf()));
    top.appendChild(el('div', 'chip lan', '✦ 灯花 ' + S.lanterns.length + '/' + META.lanternTotal));
    top.appendChild(el('div', 'sp'));
    function topBtn(label, fn) { var b = el('button', 'tbtn', label); b.onclick = fn; return b; }
    top.appendChild(topBtn('背包', function () { openModal(buildBag()); }));
    top.appendChild(topBtn('笔记', function () { openModal(buildNotes()); }));
    top.appendChild(topBtn('图鉴', function () { openModal(buildGallery()); }));
    top.appendChild(topBtn(cfg.snd ? '🔊' : '🔇', function () { cfg.snd = !cfg.snd; saveCfg(); render(); }));
    top.appendChild(topBtn('设置', function () { openModal(buildSettings()); }));
    app.appendChild(top);

    /* 场景卡 */
    var card = el('div', 'scene fade-in');
    var head = el('div', 's-head');
    head.appendChild(el('div', 's-name', sc.name));
    head.appendChild(el('div', 's-ch', chapterOf()));
    card.appendChild(head);
    var amb = el('div', 'ambient');
    card.appendChild(amb);
    typeInto(amb, sc.ambient);
    var lg = el('div', 'log');
    card.appendChild(lg);

    /* 入场/进行中的谜题（落名、对质、门锁） */
    var puzzleDefs = (sc.puzzles || []).filter(function (p) {
      if (S.solved[p.id]) return false;
      if (p.showIf && !reqOk(p.showIf)) return false;
      return true;
    });
    if (S.activeLock && !S.solved[S.activeLock]) {
      var exitHasLock = (sc.exits || []).some(function (e) { return e.lockPuzzle === S.activeLock; });
      if (exitHasLock && !puzzleDefs.some(function (p) { return p.id === S.activeLock; })) puzzleDefs.push({ id: S.activeLock });
    }
    if (puzzleDefs.length) {
      var psec = el('div', 'sec');
      psec.appendChild(el('div', 'sec-t', '机 关'));
      puzzleDefs.forEach(function (p) {
        var node = buildPuzzle(p.id);
        if (node) psec.appendChild(node);
      });
      card.appendChild(psec);
    }

    /* 热点 */
    var hotspots = (sc.hotspots || []).filter(function (h) {
      if (h.requires && !reqOk(h.requires)) return false;
      return true;
    });
    if (hotspots.length) {
      var hsec = el('div', 'sec');
      hsec.appendChild(el('div', 'sec-t', '细 看'));
      var chips = el('div', 'chips');
      hotspots.forEach(function (h) {
        var taken = (h.give && h.give.lantern && S.lanterns.indexOf(h.give.lantern.id) >= 0) ||
                    (h.give && h.give.item && S.items.indexOf(h.give.item) >= 0);
        var b = el('button', 'hs' + (taken ? ' taken' : ''), h.label + (taken ? ' ✓' : ''));
        b.dataset.hs = h.id;
        b.onclick = function () { clickHotspot(h); };
        chips.appendChild(b);
      });
      hsec.appendChild(chips);
      card.appendChild(hsec);
    }

    /* 出口 / 终章抉择 */
    if (S.scene === 'lamproom' && sc.choices) {
      var csec = el('div', 'sec');
      csec.appendChild(el('div', 'sec-t', '子 时 已 到'));
      var ex = el('div', 'exits');
      sc.choices.forEach(function (c) {
        var b = el('button', 'exit' + (reqOk(c.requires) ? '' : ' locked'), c.label);
        b.dataset.act = 'ending'; b.dataset.id = c.id;
        b.onclick = function () { chooseEnding(c); };
        ex.appendChild(b);

      esec.appendChild(el('div', 'sec-t', '去 往'));
      var exs = el('div', 'exits');
      sc.exits.forEach(function (e) {
        var ok = reqOk(e.requires);
        var b = el('button', 'exit' + (ok ? '' : ' locked'), e.label);
        b.dataset.exit = e.to;
        b.onclick = function () { clickExit(e); };
        exs.appendChild(b);
      });
      esec.appendChild(exs);
      card.appendChild(esec);
    }

    app.appendChild(card);
    renderLog();
  }

  var rendering = false, pendingRender = false;
  function render() {
    if (rendering) { pendingRender = true; return; }  // 构建期间解题只改状态，渲染完成后补一帧
    rendering = true;
    try {
      if (view === 'title') return renderTitle();
      if (view === 'ending') return renderEnding();
      renderGame();
    } finally {
      rendering = false;
      if (pendingRender) { pendingRender = false; setTimeout(render, 0); }
    }
  }

      var ed = ENDINGS[k];
      var card = el('div', 'end-card' + (seen[k] ? ' seen' : ''));
      card.innerHTML = '<b>' + ed.num + ' · ' + (seen[k] ? ed.name : '？？？') + '</b>' +
        (seen[k] ? '' : ' <span class="tag">未达成</span>') +
        '<div class="bl">' + (seen[k] ? ed.blurb : '尚无人走到这里。') + '</div>';
      box.appendChild(card);
    });
    if (S && S.lanterns) {
      box.appendChild(el('div', 'note-ch', '本局灯花'));
      box.appendChild(el('div', 'note-row', S.lanterns.length + ' / ' + META.lanternTotal));
    }
    return box;
  }

  function buildSettings() {
    var box = el('div');
    box.appendChild(el('h2', null, '设置'));
    var r1 = el('div', 'set-row');
    r1.appendChild(el('span', null, '音效'));
    var b1 = el('button', 'tbtn', cfg.snd ? '开' : '关');
    b1.onclick = function () { cfg.snd = !cfg.snd; saveCfg(); b1.textContent = cfg.snd ? '开' : '关'; };
    r1.appendChild(b1); box.appendChild(r1);
    var r2 = el('div', 'set-row');
    r2.appendChild(el('span', null, '文字速度'));
    var b2 = el('button', 'tbtn', ['瞬间', '快', '慢'][cfg.tspeed] || '快');
    b2.onclick = function () {
      cfg.tspeed = (cfg.tspeed + 1) % 3;
      saveCfg(); b2.textContent = ['瞬间', '快', '慢'][cfg.tspeed];
    };
    r2.appendChild(b2); box.appendChild(r2);
    if (S && view === 'game') {
      var r3 = el('div', 'set-row');
      r3.appendChild(el('span', null, '重新开始'));
      var b3 = el('button', 'tbtn warn', '重开新档');
      b3.style.color = '#d3705e';
      b3.onclick = function () {
        if (confirm('回到标题并重开新档？当前进度会被覆盖。')) {
          closeModal(); view = 'title'; render();
        }
      };
      r3.appendChild(b3); box.appendChild(r3);
    }
    var tip = el('div', 'note-ch', '灯花');
    box.appendChild(tip);
    box.appendChild(el('div', 'note-row', '十二粒灯花藏在「经不起第二眼」的地方。它们记得没被吃掉的记忆——集齐了，或许能看到别人看不见的结局。'));
    return box;
  }

  function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

  /* ---------------- 启动 ---------------- */
  view = 'title';
  render();
})();
</script>
</body>
</html>
